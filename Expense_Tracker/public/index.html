<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; line-height: 1.6; }
        input { display: block; width: 100%; margin: 10px 0; padding: 8px; }
        button { cursor: pointer; padding: 10px; background: #28a745; color: white; border: none; width: 100%; }
        .expense-item { border-bottom: 1px solid #ddd; padding: 10px 0; }
        #authSection, #expenseSection { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h2>Expense Tracker 💰</h2>

    <div id="authSection">
        <h3>ავტორიზაცია</h3>
        <input type="text" id="username" placeholder="მომხმარებელი">
        <input type="password" id="password" placeholder="პაროლი">
        <button onclick="auth('register')">რეგისტრაცია</button>
        <button onclick="auth('login')" style="background: #007bff; margin-top: 5px;">შესვლა</button>
    </div>

    <div id="expenseSection" class="hidden">
        <h3>ჩემი ხარჯები</h3>
        <input type="number" id="amount" placeholder="თანხა">
        <input type="text" id="category" placeholder="კატეგორია">
        <button onclick="addExpense()">დამატება</button>
        <div id="expenseList"></div>
        <button onclick="logout()" style="background: #dc3545; margin-top: 20px;">გასვლა</button>
    </div>

    <script>
        let token = localStorage.getItem('token');
        if (token) showDashboard();

        async function auth(type) {
            const user = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };
            const res = await fetch(`/auth/${type}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user)
            });
            const data = await res.json();
            if (data.token) {
                localStorage.setItem('token', data.token);
                token = data.token;
                showDashboard();
            } else {
                alert(data.message);
            }
        }

        async function showDashboard() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('expenseSection').classList.remove('hidden');
            loadExpenses();
        }

        async function loadExpenses() {
            const res = await fetch('/expenses', {
                headers: { 'Authorization': token }
            });
            const data = await res.json();
            const list = document.getElementById('expenseList');
            list.innerHTML = data.map(e => `
                <div class="expense-item"><b>${e.category}</b>: ${e.amount} GEL</div>
            `).join('');
        }

        async function addExpense() {
    const amount = document.getElementById('amount').value;
    const category = document.getElementById('category').value;

    if (!amount || !category) {
        alert("გთხოვთ შეავსოთ ორივე ველი");
        return;
    }

    const expense = { amount, category };

    const res = await fetch('/expenses', {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json', 
            'Authorization': token              
        },
        body: JSON.stringify(expense)
    });

    if (res.ok) {
        document.getElementById('amount').value = '';
        document.getElementById('category').value = '';
        loadExpenses();
    } else {
        const errorData = await res.json();
        alert("შეცდომა: " + errorData.message);
    }
}

        function logout() {
            localStorage.removeItem('token');
            location.reload();
        }
    </script>
</body>
</html>
