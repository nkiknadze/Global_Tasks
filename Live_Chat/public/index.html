<!DOCTYPE html>
<html>
<head>
    <title>Live Chat Rooms</title>
    <style>
        #messages { height: 300px; overflow-y: scroll; border: 1px solid #ccc; margin-bottom: 10px; padding: 10px; }
        .admin { color: gray; font-style: italic; }
    </style>
</head>
<body>
    <div id="setup">
        <input id="username" placeholder="სახელი">
        <select id="room">
            <option value="Chat_Room">Chat_Room</option>
            <option value="General">General_Room</option>
        </select>
        <button onclick="join()">შესვლა</button>
    </div>

    <div id="chat" style="display:none;">
        <h2 id="roomName"></h2>
        <div id="messages"></div>
        <input id="msg" placeholder="დაწერე მესიჯი...">
        <button onclick="send()">გაგზავნა</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let user, currentRoom;

        function join() {
            user = document.getElementById('username').value;
            currentRoom = document.getElementById('room').value;
            if(!user) return alert("ჩაწერე სახელი");
            
            document.getElementById('setup').style.display = 'none';
            document.getElementById('chat').style.display = 'block';
            document.getElementById('roomName').innerText = `ოთახი: ${currentRoom}`;

            socket.emit('joinRoom', { username: user, room: currentRoom });
        }

        function send() {
            const message = document.getElementById('msg').value;
            socket.emit('chatMessage', { username: user, room: currentRoom, message });
            document.getElementById('msg').value = '';
        }

        socket.on('message', (data) => {
            const div = document.createElement('div');
            div.innerHTML = `<strong>${data.user}:</strong> ${data.text}`;
            document.getElementById('messages').appendChild(div);
        });
    </script>
</body>
</html>
